# SonarQube / SonarCloud project configuration for spora-plugin-typst-frontend.
#
# Coverage is produced by Vitest (v8 provider) and lands at ./coverage/lcov.info.
# The CI workflow uses the SonarSource GitHub Action which picks up SONAR_TOKEN
# from repo secrets and reads this file.

# --- SonarCloud identity -----------------------------------------------------
sonar.organization=spora-ai
sonar.projectKey=spora-ai_spora-plugin-typst-frontend
sonar.projectName=spora-plugin-typst-frontend
sonar.projectVersion=0.1.0

# --- Source / test layout ----------------------------------------------------
# `src` only — `scripts/` is build tooling, not shipped code. The i18n
# extractor runs in CI and never reaches the browser bundle, so the family
# of plugin frontends (spora-frontend, spora-plugin-memories-frontend,
# spora-plugin-media-archive-frontend, spora-plugin-custom-skills-frontend)
# keeps it out of the analysis. A finding in the extractor is a finding in a
# tool that no operator runs; a finding in `src/` is a finding in the panel.
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# --- Coverage ----------------------------------------------------------------
# The Vitest v8 provider emits an LCOV report here. The SonarSource action
# runs after `npm run test:coverage` so coverage/lcov.info exists at scan time.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.test.inclusions=tests/**/*.{test,spec}.{js,ts}

sonar.coverage.exclusions=tests/**,src/main.ts,src/dev-main.ts,src/shims.d.ts,src/types.ts,src/style.css,src/**/*.vue,src/components/**,src/pages/**,scripts/**
sonar.exclusions=node_modules/**,dist/**,frontend/**,coverage/**,main.js,style.css,*.config.{js,ts},scripts/**

sonar.pullrequest.provider=GitHub
sonar.pullrequest.github.repository=spora-ai/spora-plugin-typst-frontend

sonar.cpd.exclusions=src/**/*.{vue,ts}
